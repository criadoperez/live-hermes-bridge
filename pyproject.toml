[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-hermes-bridge"
version = "0.1.0"
description = "OpenAI GPT-Live voice frontend for Hermes agents"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
  "websockets>=14.0",
]

[tool.setuptools.packages.find]
where = ["src"]
